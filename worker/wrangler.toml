name = "baai-chat"
main = "src/worker.js"
compatibility_date = "2024-11-01"

# Per-IP daily rate-limit store. Create with:
#   npx wrangler kv namespace create RATE_KV
# then paste the returned id below.
[[kv_namespaces]]
binding = "RATE_KV"
id = "0c93fb1b54da42419cd25236855d4b58"

[vars]
# Comma-separated list of allowed site origins (NO trailing slash).
ALLOWED_ORIGINS = "https://mamadouba2004.github.io"
# Per-visitor IP cap per day (protects the Gemini free quota).
DAILY_LIMIT = "40"
# Gemini model (free tier).
GEMINI_MODEL = "gemini-2.5-flash"

# GEMINI_API_KEY is a secret, NOT stored here. Set it with:
#   npx wrangler secret put GEMINI_API_KEY
